<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
</head>
<body>
  <div class="card single" data-ref="card-single">
    <img class="portrait" src="kaylee-headshot.jpg" alt="Kaylee Renaud" data-ref="portrait">
    <div class="name" data-ref="name">Kaylee Renaud</div>
    <div class="role" data-ref="role">Film &nbsp;·&nbsp; Costume &nbsp;·&nbsp; Writing</div>
    <div class="rule"></div>

    <div class="rows" data-ref="rows">
      <div class="row" data-ref="row-site">
        <span class="ic">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d98a9e"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9.2"/>
              <path d="M3 12h18"/>
              <path d="M12 2.8c2.7 2.6 4.2 6 4.2 9.2S14.7 18.6 12 21.2C9.3 18.6 7.8 15.2 7.8 12S9.3 5.4 12 2.8Z"/>
            </svg>
          </span>
        <span class="txt">kayleerenaud<span class="at">.</span>com</span>
      </div>

      <div class="row" data-ref="row-email">
        <span class="ic">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d98a9e"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.6" y="4.6" width="18.8" height="14.8" rx="3"/>
              <path d="M3.4 6.4 12 12.6 20.6 6.4"/>
            </svg>
          </span>
        <span class="txt">contact<span class="at">@</span>kayleerenaud.com</span>
      </div>

      <div class="row" data-ref="row-phone">
        <span class="ic">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d98a9e"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.3 3.4c.5 0 .9.3 1.1.8l1.3 3.2c.2.5.1 1-.3 1.4L7.4 9.9a12.5 12.5 0 0 0 6.7 6.7l1.1-1c.4-.4.9-.5 1.4-.3l3.2 1.3c.5.2.8.6.8 1.1v3c0 .8-.7 1.5-1.5 1.4C10.9 21.1 2.9 13.1 2.9 3.9c-.1-.8.6-1.5 1.4-1.5Z"/>
            </svg>
          </span>
        <span class="txt">(518) 226-9586</span>
      </div>

      <div class="row social" data-ref="row-social">
        <span class="ic">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d98a9e"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4"/>
              <circle cx="12" cy="12" r="4.1"/>
              <circle cx="17.4" cy="6.6" r="1.15" fill="#d98a9e" stroke="none"/>
            </svg>
          </span>
        <span class="ic">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d98a9e"
                 stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1.8" y="5.2" width="20.4" height="13.6" rx="4.2"/>
              <path d="M10.2 9.1 L15.2 12 L10.2 14.9 Z" fill="#d98a9e" stroke="none"/>
            </svg>
          </span>
        <span class="txt"><span class="at">@</span>the.miss.kaylee</span>
      </div>
    </div>
  </div>
</body>
</html>
